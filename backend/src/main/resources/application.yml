spring:
  application:
    name: cyber-heist

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyberheist}
    username: ${DB_USERNAME:cyberheist}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      pool-name: cyber-heist-pool

  jpa:
    # Flyway owns the schema. Hibernate only validates that the mapping matches.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    context-path: /

# ------------------------- Health / observability -------------------
management:
  endpoints:
    web:
      exposure:
        # Only health is public; everything else stays off the HTTP surface.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# --------------------------- Application config ---------------------------
app:
  security:
    jwt:
      # Required. No default on purpose: the app refuses to boot without it.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:cyber-heist}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
      refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:P7D}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allow-credentials: true
      max-age: PT1H
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
      window: ${AUTH_RATE_LIMIT_WINDOW:PT1M}
  player:
    initial-level: 1
    initial-experience: 0
    initial-coins: 100
    initial-energy: 100
    experience-per-level: 100

  # ------------------------------- energy ---------------------------------
  # Passive, server-authoritative regeneration. Computed lazily from
  # player_profiles.last_energy_update: floor(elapsed / interval) * amount,
  # capped at maximum. No background job; the server clock is the only input.
  energy:
    maximum: 100
    regeneration:
      enabled: ${ENERGY_REGEN_ENABLED:true}
      amount: ${ENERGY_REGEN_AMOUNT:1}
      interval-minutes: ${ENERGY_REGEN_INTERVAL_MINUTES:5}

  # ----------------------------- progression ------------------------------
  # Level curve: requiredXp(level) = round(baseExperience * growthMultiplier^(level-1))
  # XP is cumulative and never resets on level up.
  progression:
    base-experience: 100
    growth-multiplier: 1.5
    maximum-level: 100

  # --------------------------------- game ---------------------------------
  # Phase 7 settings. Everything time-based in achievements, daily challenges and
  # streaks resolves through app.game.timezone, so "today" is the server's answer
  # and never the browser's. Changing this moves the daily boundary for everyone
  # at once rather than splitting players across two different days.
  game:
    timezone: ${GAME_TIMEZONE:UTC}
    # Mixed into the daily seed. Rotating it re-cuts the whole daily rotation
    # deterministically, without editing a row.
    daily-seed-key: ${GAME_DAILY_SEED_KEY:cyber-heist}
    challenges-per-day: 3
    recent-achievement-limit: 10

logging:
  level:
    root: INFO
    com.cyberheist: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"