services:
  postgres:
    image: postgres:17-alpine
    container_name: cyber-heist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberheist}
      POSTGRES_USER: ${POSTGRES_USER:-cyberheist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberheist} -d ${POSTGRES_DB:-cyberheist}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cyber-heist

volumes:
  postgres_data:
    driver: local

networks:
  cyber-heist:
    driver: bridge